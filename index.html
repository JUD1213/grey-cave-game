<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>灰石洞窟 - 完整版</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: #000;
    color: #fff;
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    image-rendering: pixelated;
}

.dither-50 {
    background-image: radial-gradient(#fff 0.5px, transparent 0);
    background-size: 2px 2px;
    opacity: 0.1;
}

@keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
}
.cursor { 
    display: inline-block;
    width: 8px;
    height: 18px;
    background: #fff;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 4px;
}

/* 頂部狀態欄 */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #000;
    border-bottom: 2px solid #fff;
    font-family: 'VT323', monospace;
    font-size: 24px;
}
.stat { display: flex; align-items: center; gap: 8px; }
.stat .material-symbols-outlined { font-size: 24px; }

/* POV 渲染區 */
.viewport {
    position: relative;
    flex: 1;
    min-height: 400px;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.stone-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
}
.stone-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) contrast(200%) brightness(80%);
}


/* 圖片框 - 正方形 */
.image-frame {
    position: relative;
    z-index: 10;
    width: 640px;
    max-width: 640px;
    height: 360px;
    max-height: 360px;
    border: none;  /* ← 移除邊框 */
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: none;  /* ← 移除陰影 */
    overflow: hidden;
}

.scene-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    filter: grayscale(100%) contrast(200%) brightness(90%);
}

.title-img {
    width: 100%;
    height: 100%;
    object-fit: contain !important;  /* 完整顯示,不裁切 */
    filter: grayscale(100%) contrast(150%) brightness(95%);
}
.scene-label {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #000;
    padding: 2px 12px;
    font-family: 'VT323', monospace;
    font-size: 14px;
    white-space: nowrap;
    letter-spacing: 1px;
}

/* 文字對話框 */
.dialog-box {
    background: #000;
    padding: 16px;
    border-top: 2px solid #fff;
    height: 250px;
    flex-shrink: 0;        /* ← 加這行,防止被壓縮 */
}
.dialog-inner {
    border: 2px solid #fff;
    height: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;    /* ← 加這行!內容靠底部 */
    gap: 8px;
    overflow-y: auto;
    overflow-x: hidden;    /* ← 加這行,避免橫向滾動 */
}
.dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #fff;
    padding-bottom: 6px;
    margin-bottom: 6px;
}
.dialog-title {
    font-family: 'VT323', monospace;
    font-size: 16px;
    letter-spacing: 2px;
}
.text-content {
    font-size: 18px;
    line-height: 1.7;
    color: #fff;
    white-space: pre-wrap;
    margin-top: auto;
}

/* 選項按鈕 */
.choices-container {
    padding: 12px 16px;
    background: #000;
    border-top: 1px solid #fff;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
}

.choice-btn {
    width: 100%;
    padding: 12px 16px;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.1s;
    box-shadow: 3px 3px 0 #000;
    opacity: 0;
    animation: slideIn 0.3s ease forwards;
}
.choice-btn:nth-child(1) { animation-delay: 0.05s; }
.choice-btn:nth-child(2) { animation-delay: 0.1s; }
.choice-btn:nth-child(3) { animation-delay: 0.15s; }
.choice-btn:nth-child(4) { animation-delay: 0.2s; }
.choice-btn:nth-child(5) { animation-delay: 0.25s; }
.choice-btn:nth-child(6) { animation-delay: 0.3s; }

.choice-btn:hover {
    background: #ccc;
    transform: translateX(4px);
}
.choice-btn:active {
    transform: translateX(6px) translateY(2px);
    box-shadow: 0 0 0 transparent;
}

.choice-btn.disabled {
    background: #333;
    color: #666;
    border-color: #444;
    cursor: not-allowed;
    opacity: 0.6;
}
.choice-btn.disabled:hover {
    background: #333;
    transform: none;
}

/* 底部工具欄 */
.nav-bar {
    height: 64px;
    background: #000;
    border-top: 2px solid #fff;
    display: flex;
    justify-content: space-around;
    align-items: center;
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: 'VT323', monospace;
    font-size: 14px;
    padding: 8px;
    transition: transform 0.1s;
}
.nav-item:hover { transform: scale(1.1); }
.nav-item .material-symbols-outlined { font-size: 28px; }

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
.modal-overlay.active { display: flex; }
.modal {
    background: #000;
    border: 3px solid #fff;
    padding: 24px;
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 6px 6px 0 #fff;
}
.modal h2 {
    font-family: 'VT323', monospace;
    font-size: 32px;
    color: #fff;
    margin-bottom: 16px;
    border-bottom: 2px solid #fff;
    padding-bottom: 8px;
}
.modal-content {
    color: #fff;
    line-height: 1.8;
    font-size: 16px;
}
.modal-item {
    padding: 10px;
    margin: 6px 0;
    background: #111;
    border-left: 3px solid #fff;
}
.modal-close {
    margin-top: 16px;
    padding: 12px 24px;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    cursor: pointer;
    font-size: 18px;
    font-family: 'VT323', monospace;
    width: 100%;
    transition: all 0.2s;
    box-shadow: 3px 3px 0 #000;
}
.modal-close:hover { background: #ccc; }

/* 響應式 */
@media (min-width: 1024px) {
    body {
        max-width: 1200px;
        margin: 0 auto;
    }
}

@media (max-width: 768px) {
    .image-frame {
        width: 80vw;
        max-width: 400px;
        height: calc(80vw * 9 / 16);
        max-height: 250px;
    }
    .text-content { font-size: 16px; }
}
</style>
</head>

<script>
// ===== 遊戲狀態 =====
const state = {
    scene: 'S01',
    hp: 24,
    maxHp: 24,
    money: 100,
    items: [],
    flags: { ears: 0, cattleReleased: false, visitedDeep: false },
    injuries: []
};

// ===== 打字機效果 =====
let typewriterRunning = false;

function typeText(text, element, speed = 25) {
    return new Promise(resolve => {
        typewriterRunning = true;
        element.innerHTML = '';
        let i = 0;
        
        function type() {
            if (i < text.length) {
                if (text[i] === '\n') {
                    element.innerHTML += '<br>';
                } else {
                    element.innerHTML += text[i];
                }
                i++;

                const dialogInner = element.closest('.dialog-inner');
                if (dialogInner) {
                    dialogInner.scrollTop = dialogInner.scrollHeight;
                }
                setTimeout(type, speed);
            } else {
                element.innerHTML += '<span class="cursor"></span>';
                typewriterRunning = false;
                resolve();
            }
        }
        type();
    });
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('text-content').addEventListener('click', () => {
        if (typewriterRunning) {
            typewriterRunning = false;
            const scene = scenes[state.scene];
            document.getElementById('text-content').innerHTML = scene.text.replace(/\n/g, '<br>') + '<span class="cursor"></span>';
            showChoices(scene.choices);
        }
    });
});

// ===== 場景資料 =====
const scenes = {
    START: { 
        title: '灰石洞窟', 
        label: 'TITLE_SCREEN', 
        img: 'images/title.jpg',  // ← 把這張圖存成 title.jpg 放到 images 資料夾
        text: `一個關於哥布林、洞窟與選擇的冒險故事

準備好火把。
做好選擇。
活著回來。

DEMO v1.0`,
        choices: [
            { text: '🎮 開始遊戲', next: 'S01' },
            { text: '💾 繼續遊戲', next: 'LOAD_GAME', cond: () => localStorage.getItem('灰石洞窟_存檔') },
            { text: '📖 遊戲說明', next: 'HELP' }
        ]
    },
    
    HELP: {
        title: '遊戲說明',
        label: 'HELP',
        img: 'images/title.jpg',
        text: `===== 遊戲說明 =====

【玩法】
這是一個文字冒險遊戲,透過選擇選項推進劇情。

【重要提示】
- 購買裝備會影響戰鬥結果
- 火把能讓你看清洞窟
- 摸黑探索風險很高
- 錯誤的選擇可能導致死亡

【操作】
- 點擊選項進行選擇
- 點擊文字可跳過打字效果
- 底部按鈕:背包/存檔/讀檔

【目標】
清剿哥布林洞窟,救出牲畜,活著回來。

準備好了嗎?`,
        choices: [
            { text: '← 返回', next: 'START' },
            { text: '🎮 開始遊戲', next: 'S01' }
        ]
    },
    
    LOAD_GAME: {
        title: '讀取存檔',
        label: 'LOAD',
        img: 'images/title.jpg',
        text: `確定要讀取之前的存檔嗎?`,
        choices: [
            { text: '✓ 確定讀取', next: 'LOADING', action: () => {
                const saved = localStorage.getItem('灰石洞窟_存檔');
                if (saved) {
                    Object.assign(state, JSON.parse(saved));
                }
            }},
            { text: '✗ 取消', next: 'START' }
        ]
    },
    
    LOADING: {
        title: '讀取中...',
        label: 'LOADING',
        img: 'images/title.jpg',
        getText: () => `存檔已讀取!

HP: ${state.hp}/${state.maxHp}
金錢: ${state.money}銅
物品: ${state.items.length}個
哥布林耳朵: ${state.flags.ears}對

繼續冒險吧!`,
        choices: [
            { text: '→ 繼續', next: 'DYNAMIC' }
        ],
        getNext: () => state.scene
    },

    S01: { title: '落水丘旅館', label: 'LOCATION_INN', img: 'images/旅館室內（起床場景背景）.png',
        text: `你從硬板床上起身,腰背有些酸痛。晨光透過半掩的窗戶投射進來,旅館的空氣裡混著陳舊木料和炭火的味道。你拿起一塊麵包簡單吃了早餐,拍拍皮甲上的灰,把短劍繫回腰帶。

你走向長澤地區的酒館。`,
        choices: [{ text: '前往長澤酒館', next: 'S02' }]
    },
    
    S02: { title: '酒館', label: 'GUILD_HALL', img: 'images/冒險者公會大廳.png',
        text: `你走進酒館大廳,空氣裡有皮革和油脂的氣味。告示板正中央釘著一張墨跡未乾的紙。

「緊急委託:清剿哥布林洞窟」
「昨晚哥布林襲擊了牧場,酪畜被掠奪,就連農場主都受傷了!必須立刻清剿!」
「報酬:60銅。每對耳朵加賞。」

「冒險者公會提醒:洞內極黑,自備照明。」

看來這就是目前最棘手的麻煩了。你撕下了告示。

「名字。」櫃台用羽毛筆飛快地劃了一下,聲音沒有起伏。

「收你20銅幣,回來用左耳換錢。如果你沒回來,這筆錢會留給下一個進洞收屍的人。」`,
        choices: [{ text: '支付20銅押金,前往鐵匠鋪', next: 'S03', action: () => state.money -= 20 }]
    },
    
    S03: { title: '啤酒花鐵匠鋪', label: 'BLACKSMITH', img: 'images/鐵匠背對敲打.png',
        text: `啤酒花街的鐵匠鋪裡瀰漫著火星和金屬的氣味。光著膀子的矮壯男人坐在工作台前,手裡的重鎚規律敲擊著,幾乎不抬頭。

你可以在這裡購買裝備:`,
        choices: [
            { text: '🗡️ 匕首 — 8銅', next: 'S03', price: 8, item: '匕首', desc: '匕首很輕,重心平衡,看起來很適合投擲' },
            { text: '🛡️ 木盾 — 12銅', next: 'S03', price: 12, item: '木盾', desc: '木盾相當厚實,不知複合了幾片木板,拿起來有些笨重' },
            { text: '🔧 修理皮甲 — 5銅', next: 'S03', price: 5, item: '皮甲已修理', desc: '縫線重新拉緊後,皮甲穿起來變得扎實多了' },
            { text: '前往雜貨店', next: 'S04' }
        ]
    },
    
    S04: { title: '長澤市集', label: 'GENERAL_STORE', img: 'images/雜貨店室內.png',
        text: `你回到長澤市集一個,走進一間小店,貨架上堆滿瓶瓶罐罐,散發著各種物藥混合後的淡淡氣味。

你可以在這裡購買消耗品:`,
        choices: [
            { text: '🔥 火把×3 — 3銅', next: 'S04', price: 3, item: '火把', desc: '粗糙的木棒纏著浸油布料,聞起來很刺鼻', action: () => state.flags.hasFireTorch = true },
            { text: '🪢 繩索 — 4銅', next: 'S04', price: 4, item: '繩索', desc: '亞麻繩索,盤成一圈掛在腰間' },
            { text: '⚗️ 治療藥水 — 10銅', next: 'S04', price: 10, item: '治療藥水', desc: '玻璃瓶裡晃盪著紅酒色的液體' },
            { text: '前往陰花巷', next: 'S05' }
        ]
    },
    
    S05: { title: '陰花巷', label: 'BLACK_MARKET', img: 'images/黑市暗巷.png',
        text: `暗巷盡頭掛著一道簾子,掀開後裡面光線更暗。賣家靠牆坐著,沒有說話,讓你自己看。

你可以在這裡購買特殊物品:`,
        choices: [
            { text: '☠️ 毒藥 — 15銅', next: 'S05', price: 15, item: '毒藥', desc: '瓶身在微光下閃爍,裡頭的液體呈現不詳的暗紫色' },
            { text: '💨 煙霧彈 — 12銅', next: 'S05', price: 12, item: '煙霧彈', desc: '丟出會噴發出濃煙,別丟在敵人身上,要丟在腳邊' },
            { text: '🔥 燃燒瓶 — 14銅', next: 'S05', price: 14, item: '燃燒瓶', desc: '瓶口塞著浸油的布條,點上火就是極其便利的火藥桶' },
            { text: '出發前往北貧民窟郊外', next: 'W01' }

    },
    
    W01: { title: '郊外', label: 'WILDERNESS', img: 'images/野外小徑（白天出發）.png',
        text: `你沿著溪流往東北走了半天。溪水清澈,兩岸草地在風裡搖動,偶爾有鳥從頭頂掠過。越往南走,草叢愈見稀疏,地面開始出現凌亂的痕跡。

地面上,原本平整的泥土被踩得凌亂,混雜著碎裂的骨頭與暗褐色的血跡。草叢被粗暴地壓平,指向前方不遠處那個陰森的山洞。

// ===== 渲染場景 =====
async function show(id) {
    const s = scenes[id];
    if (!s) return;
    
    state.scene = id;
    
    document.getElementById('scene-title').textContent = s.title;
    document.getElementById('scene-label').textContent = s.label || 'UNKNOWN';
    const imgEl = document.getElementById('scene-image');
imgEl.src = s.img;

// 標題畫面用特殊 class
if (id === 'START' || id === 'HELP' || id === 'LOAD_GAME' || id === 'LOADING') {
    imgEl.className = 'title-img';
} else {
    imgEl.className = 'scene-img';
}

// 支持動態黑暗遮罩
const darknessOverlay = document.getElementById('darkness-overlay');
const darknessValue = s.getDarkness ? s.getDarkness() : (s.darkness || 0);
darknessOverlay.style.opacity = darknessValue;

updateStatus();

document.getElementById('choices-container').innerHTML = '';

const textEl = document.getElementById('text-content');
const text = s.getText ? s.getText() : s.text;
await typeText(text, textEl, 35);

const dialogInner = document.querySelector('.dialog-inner');
dialogInner.scrollTop = dialogInner.scrollHeight;

setTimeout(() => showChoices(s.choices), 300);

window.scrollTo(0, 0);
}
// ===== showPurchaseConfirm 函數 =====
function showPurchaseConfirm(choice) {
    const container = document.getElementById('choices-container');
    
    // 清空選項區
    container.innerHTML = '';
    
    // 創建描述框
    const descBox = document.createElement('div');
    descBox.style.cssText = `
        background: #111;
        border: 2px solid #fff;
        padding: 16px;
        margin-bottom: 12px;
    `;
    descBox.innerHTML = `
        <div style="font-size: 18px; margin-bottom: 12px; color: #fff;">
            ${choice.desc || '確定購買此物品?'}
        </div>
        <div style="color: #ccc; font-size: 16px;">
            價格: ${choice.price} 銅
        </div>
        <div style="color: #888; font-size: 14px; margin-top: 4px;">
            購買後剩餘: ${state.money - choice.price} 銅
        </div>
    `;
    container.appendChild(descBox);
    
    // 確認按鈕
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'choice-btn';
    confirmBtn.textContent = '✓ 確認購買';
    confirmBtn.onclick = () => {
        state.money -= choice.price;
        state.items.push(choice.item);
        if (choice.action) choice.action();
        updateStatus();
        showChoices(scenes[state.scene].choices);
    };
    container.appendChild(confirmBtn);
    
    // 取消按鈕
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'choice-btn';
    cancelBtn.textContent = '✗ 取消';
    cancelBtn.onclick = () => {
        showChoices(scenes[state.scene].choices);
    };
    container.appendChild(cancelBtn);
}

// ===== showChoices 函數 =====
function showChoices(choices) {
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    
    choices.forEach(c => {
        const isShopItem = c.price !== undefined;
        const canAfford = !isShopItem || state.money >= c.price;
        const alreadyOwned = c.item && state.items.includes(c.item);
        
        if (c.cond && !c.cond()) return;
        
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        
        if (isShopItem) {
            if (alreadyOwned) {
                btn.className += ' disabled';
                btn.textContent = c.text + ' (已購買)';
                btn.disabled = true;
            } else if (!canAfford) {
                btn.className += ' disabled';
                btn.textContent = c.text + ' (金錢不足)';
                btn.disabled = true;
            } else {
                btn.textContent = c.text;
                btn.onclick = () => {
                    showPurchaseConfirm(c);  // ← 只有這一行
                };
            }
        } else {
            btn.textContent = c.text;
            btn.onclick = () => {
                if (c.action) c.action();
                const nextScene = c.next === 'DYNAMIC' ? scenes[state.scene].getNext() : c.next;
                show(nextScene);
            };
        }
        
        container.appendChild(btn);
    });
}
function updateStatus() {
    document.getElementById('hp-display').textContent = `HP:${state.hp}/${state.maxHp}`;
    document.getElementById('money-display').textContent = `${state.money}銅`;
}

function openInventory() {
    const content = document.getElementById('inventory-content');
    if (state.items.length === 0) {
        content.innerHTML = '<p style="text-align:center; color:#666;">背包是空的</p>';
    } else {
        content.innerHTML = state.items.map(item => 
            `<div class="modal-item">📦 ${item}</div>`
        ).join('');
    }
    document.getElementById('inventory-modal').classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function saveGame() {
    try {
        localStorage.setItem('灰石洞窟_存檔', JSON.stringify(state));
        alert('✅ 遊戲已存檔');
    } catch (e) {
        alert('❌ 存檔失敗');
    }
}

function loadGame() {
    try {
        const saved = localStorage.getItem('灰石洞窟_存檔');
        if (saved) {
            Object.assign(state, JSON.parse(saved));
            show(state.scene);
            alert('✅ 遊戲已讀取');
        } else {
            alert('❌ 沒有存檔');
        }
    } catch (e) {
        alert('❌ 讀檔失敗');
    }
}

function resetGame() {
    state.hp = 24;
    state.money = 1;
    state.items = [];
    state.flags = { ears: 0, cattleReleased: false, visitedDeep: false };
    state.injuries = [];
}

show('START');
